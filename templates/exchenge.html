{% extends "base.html" %}

{% block header %}
<header class="head">
    <div class="head_div">
        <nav class="head_nav">
            <a href="/"><img src="/static/images/logo.svg" alt=""></a>
        </nav>
    </div>
</header>
{% endblock %}

{% block content %}
<div class="obmen">
    <div class="obmen-okno">
        <h2>Обмен</h2>

        <div class="input_block">
            <span class="input_lable">Отдаете</span>
            <div class="input_mini">
                <input type="number" id="input_send" value="1000" class="kurs_input" step="0.01">
                <div class="current_select_valute">
                    <select class="current_select_valute1" id="select_valute_from">
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="RUB">RUB</option>
                        <option value="CNY">CNY</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="input_block">
            <span class="input_lable">Получаете</span>
            <div class="input_mini">
                <input type="number" id="input_get" value="1000" class="kurs_input" step="0.01">
                <div class="current_select_valute">
                    <select class="current_select_valute1" id="select_valute_to">
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="RUB">RUB</option>
                        <option value="CNY">CNY</option>
                    </select>
                </div>
            </div>
        </div>

        <a class="button_login" href="/register">Обменять сейчас</a>
        <p class="timer_info">Курс зафиксируется на 15 минут</p>
    </div>
</div>
{% endblock %}
