{% extends "base.html" %}

{% block header %}
<header class="head">
    <div class="head_div">
        <nav class="head_nav">
            <a href="/"><img src="/static/images/logo.svg" alt=""></a>
            <ul class="head_list">
                <li><a href="/exchange">К обмену</a></li>
            </ul>
        </nav>
    </div>
</header>
{% endblock %}

{% block content %}
<div class="profile-card">
    <div class="profile-card-info">
        <h1>{{ user.first_name }} {{ user.last_name }}</h1>
        <span class="balance">Баланс: 0</span>

        <p>Email: <a href="mailto:{{ user.email }}" class="profile-email">{{ user.email }}</a></p>

        <button class="reg-btn">
            <a href="/exchange" class="k-obmenu">К обмену</a>
        </button>
    </div>
</div>
{% endblock %}
