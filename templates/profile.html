{% extends "base.html" %}

{% block header %}
<header class="head">
    <div class="head_div">
        <nav class="head_nav">
            <a href="{{ url_for('index') }}"><img src="/static/images/logo.svg" alt=""></a>
            <ul class="head_list">
                <li><a href="{{ url_for('exchange') }}">К обмену</a></li>
            </ul>
        </nav>
    </div>
</header>
{% endblock %}

{% block content %}
<div class="profile-card">
    <div class="profile-card-info">
        <h1>{{ user.first_name }} {{ user.last_name }}</h1>
        {% for a in balances %}
            <span class="balance">{{ a.amount }} {{ a.currency }}</span>
        {% endfor %}
        <p>Email: <a href="mailto:{{ user.email }}" class="profile-email">{{ user.email }}</a></p>

        <button class="reg-btn">
            <a href="{{ url_for('exchange') }}" class="k-obmenu">К обмену</a>
        </button>
    </div>
</div>
{% endblock %}
