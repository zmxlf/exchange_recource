{% extends "base.html" %}

{% block header %}
<header class="head">
    <div class="head_div">
        <nav class="head_nav">
            <a href="{{ url_for('index') }}"><img src="/static/images/logo.svg" alt=""></a>
        </nav>
    </div>
</header>
{% endblock %}

{% block content %}
<div class="reg-container">
    <div class="reg-card">
        <h2>Вход</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="error-box">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form id="loin-form" method="POST" action="{{ url_for('login') }}">
            <div class="reg-group">
                <label for="email">Электронная почта</label>
                <input type="email" name="email" id="email" required placeholder="example@mail.com">
            </div>
            <div class="reg-group">
                <label for="password">Пароль</label>
                <input type="password" name="password" id="password" required placeholder="Минимум 6 символов">
            </div>
            <button type="submit" class="reg-btn">Войти</button>
        </form>

        <p class="reg-footer">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
    </div>
</div>
{% endblock %}
