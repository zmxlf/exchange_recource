<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zalupoker</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="shortcut icon" href="/static/images/favicon.svg" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

      
</head>
<body>
    <header class="head">
        <div class="head_div">
            <nav class="head_nav">
                <a href="index.html"><img src="/static/images/logo.svg" alt=""></a>
                
            </nav>
        </div>


        


        </div>
    </header>


    
    <main>
        <div class="reg-container">


            <div class="reg-card">
                <h2>Вход</h2>

                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="error-box">
                        {% for message in messages %}
                            <p>{{ message }}</p>
                        {% endfor %}
                     </div>
                    {% endif %}
                {% endwith %}


                <form id="loin-form" method="POST">

                    <div class="reg-group">
                        <label for="email">Электронная почта</label>
                        <input type="email" name="email" id="email" required placeholder="example@mail.com">
                    </div>

                    <div class="reg-group">
                        <label for="password">Пароль</label>
                        <input type="password" name="password" id="password" required placeholder="Минимум 6 символов">
                    </div>

                    <button type="submit" class="reg-btn">Войти</button>

                </form>

                <p class="reg-footer">Нет аккаунта? <a href="sgin.html">Зарегестрироваться</a></p>
            </div>
            
        </div>
        
    </main>


    <footer class="footer">
        <div class="footer-top">
            <span>
                Никита СОСИ ХУЙ
            </span>

        </div>

        <div class="footer-down">
            <span>
                Zalupoker
            </span>
              
            <h1>
                © 2026 zalupoker Exchange
            </h1>
        </div>
    </footer>


</body>
</html>
